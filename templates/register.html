{% extends "base.html" %} {% block content %}

<h2>Register New User</h2>

<div class="container" id="mainContainer" style="border: none; padding: 0;">
  <div style="display: flex; flex-wrap: wrap; gap: 20px;">

    <!-- Video Section -->
    <div style="flex: 1; min-width: 300px;">
      <div class="video-container">
        <video id="videoElement" autoplay playsinline muted class="video-feed"></video>
        <canvas id="overlayCanvas"
          style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none;"></canvas>
        <canvas id="captureCanvas" style="display: none"></canvas>
      </div>
      <div id="statusArea" class="status-msg" style="display: none;"></div>
    </div>

    <!-- Form Section -->
    <div style="flex: 1; min-width: 300px; background: #f9f9f9; padding: 20px; border: 1px solid #ccc;">
      <h3>User Details</h3>

      <label>Full Name</label>
      <input type="text" id="username" placeholder="e.g. John Doe" />

      <label>GR Number</label>
      <input type="text" id="grNumber" placeholder="e.g. GR-2024-001" />

      <label>Section</label>
      <select id="section" style="width: 100%; padding: 6px; margin-bottom: 10px; border: 1px solid #999;">
        <option value="" disabled selected>Select Section</option>
        <option value="A">Section A</option>
        <option value="B">Section B</option>
        <option value="C">Section C</option>
        <option value="D">Section D</option>
        <option value="E">Section E</option>
      </select>

      <label>Class / Designation</label>
      <input type="hidden" id="className" />

      <!-- Simplified Tags for Institutional Look -->
      <div id="classTagsContainer" style="margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap;">
        <!-- Tags injected by JS -->
      </div>

      <div id="newClassInputArea" style="display: none; gap: 5px; margin-bottom: 10px;">
        <input type="text" id="newClassInput" placeholder="Enter class name" />
        <button id="confirmClassBtn" class="btn" style="background:#ddd;">OK</button>
      </div>

      <label>Father's Name</label>
      <input type="text" id="fatherName" placeholder="e.g. Robert Doe" />

      <div style="margin-top: 20px;">
        <button id="captureBtn" class="btn btn-primary" style="width: 100%;">
          Capture & Register
        </button>
      </div>
    </div>

  </div>
</div>

<!-- Inline styles for the tags to match new theme -->
<style>
  .tag {
    background: #e0e0e0;
    border: 1px solid #ccc;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    color: #333;
  }

  .tag.selected {
    background: var(--primary-green);
    color: white;
    border-color: var(--secondary-green);
  }

  .tag:hover:not(.selected) {
    background: #d0d0d0;
  }

  .tag-add-btn {
    background: transparent;
    border: 1px dashed #999;
    color: #666;
  }
</style>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
